[package]
name = "lumela"
version = "0.2.0"
description = "Lumela: capture, beautify, annotate, redact and share screenshots"
authors = ["Lumela contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tw4/lumela"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.10"
image = "0.25.10"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
wallpaper = "3.2.0"
regex = "1.13.1"
tauri-plugin-autostart = "2.7.0"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"] }
tauri-plugin-drag = "2.1.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation_Collections", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-vision = { version = "0.3.2", features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes"] }

